# llama.cpp router mode — Vulkan builds, dual RX 9060 XT (32 GB)
#
# One llama-server process owns :8080 and loads a model on demand; the child
# instance gets an ephemeral port and the router proxies to it. Model args live
# here because router mode has no per-model command hook — the launchers in
# /run/media/rodri/AI/sh stay the source for single-slot runs.
#
# Verified 2026-11-11 on build 11962 (f5222f25c), Vulkan: parse, load, proxy.
#
#   PORT=8080 /run/media/rodri/AI/sh/llama-router.sh up
#
# Every key maps to the long form of a llama-server flag without the dashes.

version = 1

[*]
host = 127.0.0.1
jinja = true
n-gpu-layers = 99
parallel = 1

# ---------------------------------------------------------------- primary coder
# 25.4 GiB on both cards, q4_0 KV, MTP speculation. Needs the decision slot
# (:8083, ~6 GB) evicted first: 25 + 6 > 32.
[qwen3.6-35b]
model = /run/media/rodri/AI/models/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-MTP-GGUF/Hermes3.6-35B-A3B-Uncensored-Genesis-MTP-MXFP4.gguf
mmproj = /run/media/rodri/AI/models/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-MTP-GGUF/mmproj-Hermes3.6-35B-A3B-Uncensored-Genesis-F16.gguf
device = Vulkan0,Vulkan1
split-mode = layer
tensor-split = 50,50
fit = off
ctx-size = 131072
batch-size = 2048
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
flash-attn = on
threads = 4
threads-batch = 4
spec-type = draft-mtp
spec-draft-n-max = 4
reasoning = on
temp = 0.8
top-p = 0.95
top-k = 40
min-p = 0.0

# ------------------------------------------------------------ general heavy
# 18 GiB, layer split, no tensor-split. 65536 ctx keeps the KV cache sane;
# the single-slot launcher uses 262144 on the whole card.
[gemma4-26b]
model = /run/media/rodri/AI/models/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
device = Vulkan0,Vulkan1
split-mode = layer
ctx-size = 65536
batch-size = 2048
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
flash-attn = on
threads = 8
threads-batch = 8
chat-template-kwargs = {"enable_thinking": false}
reasoning = off
temp = 0.6
top-k = 64
top-p = 0.9
min-p = 0.05
repeat-penalty = 1.1

# --------------------------------------------------------------- uncensored RP
# 1.5 GiB, one card, q8_0 KV (Vulkan needs flash attention for it).
[lfm3-1.7b]
model = /run/media/rodri/AI/models/AtomicChat/LFM3-1.7B-Uncensored-GGUF/LFM3-1.7B-Uncensored-AD-Q4_K_M.gguf
device = Vulkan0
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
reasoning = off

# ---------------------------------------------------------------- OCR / vision
[lighton-ocr-0.8b]
model = /run/media/rodri/AI/models/prithivMLmods/LightOnOCR-3-0.8B-GGUF/LightOnOCR-3-0.8B.Q4_K_M.gguf
mmproj = /run/media/rodri/AI/models/prithivMLmods/LightOnOCR-3-0.8B-GGUF/LightOnOCR-3-0.8B.mmproj-q8_0.gguf
device = Vulkan0
ctx-size = 8192
reasoning = off
